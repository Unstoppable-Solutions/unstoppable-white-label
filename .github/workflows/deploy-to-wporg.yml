name: Deploy to WordPress.org

# Live. Fires on every published GitHub Release and pushes that version to
# the WordPress.org SVN repo at https://wordpress.org/plugins/unstoppable-white-label/
#
# SVN_USERNAME and SVN_PASSWORD are org-level secrets on unstoppable-solutions
# (not per-repo). SLUG is set below.
#
# Marketing assets (screenshots, banner, icon) live in .wordpress-org/ and are
# mirrored to the SVN assets/ directory by this action on every deploy. SVN is
# treated as a mirror, not a store: anything uploaded straight to SVN without a
# matching file in .wordpress-org/ is removed on the next release.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Push to WordPress.org SVN
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: unstoppable-white-label

      - name: Upload release zip as a GitHub Release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.deploy.outputs.zip-path }}
